name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile Python
        run: python3 -m py_compile validator.py ci_selftest.py

      - name: Run dependency-free security self-test
        run: python3 ci_selftest.py

      # Run adversarial FIFO/TOCTOU/JSON cases, in addition to the
      # dependency-free real-OpenSSH selftest above.
      - name: Verify adversarial recovery validator regressions
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/recovery-pytest"
          "$RUNNER_TEMP/recovery-pytest/bin/python" -m pip install --disable-pip-version-check --quiet "pytest==8.4.2"
          "$RUNNER_TEMP/recovery-pytest/bin/python" -B -m pytest -p no:cacheprovider -q tests/test_validator.py

      - name: Assert recovery workflow wiring
        run: |
          set -euo pipefail
          grep -F -- '--producer-signature "$PRODUCER_SIGNATURE"' .github/workflows/recovery-evidence.yml
          grep -F -- '--base-producer-receipt "$BASE_PRODUCER_RECEIPT"' .github/workflows/recovery-evidence.yml
          grep -F -- '--allowed-signers "$GITHUB_WORKSPACE/keys/allowed_signers"' .github/workflows/recovery-evidence.yml
